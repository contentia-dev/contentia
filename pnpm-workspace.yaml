packages:
  - "packages/contentia"
  - "packages/vite-plugin"
  - "packages/astro"
  - "packages/decap"
  - "docs"
  - "apps/cli"
  - "apps/vscode"
  # Dev workspace opened by the extension's launch config; links the local contentia build.
  - "apps/vscode/fixtures/playground"

catalogs:

  astro:
    "@astrojs/check": "^0.9.12"
    "@astrojs/mdx": "^8.1.6"
    "@astrojs/react": "^7.1.9"
    "astro": "^7.4.12"

  aws:
    "aws-jwt-verify": "^5.2.1"
  default:
    "@effect/platform-node": "^4.1.4"
    "@effect/platform-node-shared": "^4.1.4"
    "@mdx-js/rollup": "^3.1.1"
    "@tailwindcss/vite": "^4.3.5"
    "bcryptjs": "^3.0.3"
    "effect": "^4.1.4"
    "es-module-lexer": "^3.0.4"
    "gray-matter": "^4.0.3"
    "js-yaml": "^5.5.0"
    "jsonwebtoken": "^9.0.3"
    "jwt-decode": "^4.0.0"
    "magic-string": "^1.4.5"
    "minimatch": "^11.0.8"
    "tailwindcss": "^4.3.5"
    "trash": "^10.1.1"
    "undici": "^8.12.4"
    "uuid": "^14.0.3"
    "ws": "^8.23.0"
    "yaml": "^2.9.1"

  # The Decap CMS distribution @contentia/decap is built against (a peer there; dev-only here).
  decap:
    "@laikacms/decap-cms": "^4.2.0"

  docs:
    "mermaid": "^12.3.0"
    "typedoc": "^0.28.20"
    "typedoc-plugin-markdown": "^4.14.1"
    "typedoc-vitepress-theme": "^1.1.4"
    "vitepress-openapi": "0.2.14"

  lint:
    "@eslint/js": "^10.0.1"
    "@typescript-eslint/eslint-plugin": "^8.72.2"
    "@typescript-eslint/parser": "^8.72.2"
    "eslint": "^10.15.0"
    "globals": "^17.14.0"
    "typescript-eslint": "^8.72.2"
    # typescript-eslint loads `typescript` as a peer and refuses TS 7, so the root (where ESLint
    # runs) aliases it to the TS 6 API. Packages keep `catalog:tools` and build with TS 7's tsc.
    # Drop this once typescript-eslint supports TS 7:
    # https://github.com/typescript-eslint/typescript-eslint/issues/10940
    "typescript": "npm:@typescript/typescript6@^6.0.2"

  # MCP SDK, used by contentia/server/mcp (an optional peer of contentia, so only consumers
  # that mount the MCP server install it) and by the CLI's `contentia local mcp`.
  mcp:
    "@modelcontextprotocol/sdk": "1.32.2"

  octokit:
    "@octokit/auth-app": "^8.3.1"
    "@octokit/rest": "^22.0.1"

  react:
    "@vitejs/plugin-react": "^6.3.0"
    "react": "^19.3.1"
    "react-dom": "^19.3.1"

  schema:
    "@standard-schema/spec": "^1.1.0"
    "json-schema": "^0.4.0"

  server:
    "@hono/node-server": "^2.1.8"
    "hono": "^4.13.18"

  tanstack:
    "@tanstack/react-router": "1.170.46"
    "@tanstack/router-plugin": "^1.169.0"

  tools:
    "@vitest/coverage-v8": "^5.1.0"
    "rimraf": "^6.1.4"
    "rolldown": "^1.3.2"
    "tsup": "^9.0.0"
    "turbo": "^2.11.11"
    "typescript": "^6.0.3"
    "vite": "^8.3.8"
    "vitest": "^5.1.0"

  types:
    "@cloudflare/workers-types": "^5.20261115.1"
    "@types/bcryptjs": "^3.0.0"
    "@types/js-yaml": "^4.0.9"
    "@types/json-schema": "^7.0.15"
    "@types/jsonwebtoken": "^9.0.10"
    "@types/jwt-decode": "^3.1.0"
    "@types/mdx": "^2.0.14"
    "@types/node": "^26.6.6"
    "@types/react": "^19.3.0"
    "@types/react-dom": "^19.3.0"
    "@types/uuid": "^11.0.0"

  vue:
    "vitepress": "^1.6.4"
    "vue": "^3.5.45"

overrides:
  axios@>=1.0.0 <1.20.0: ^1.20.0
  brace-expansion@>=3.0.0 <5.0.7: ^5.0.7
  brace-expansion@>=4.0.0 <5.0.12: ^5.0.12
  effect@>=4.0.0-beta.0 <4.0.0-beta.103: ^4.0.0
  esbuild@<=0.24.2: ^0.25.0
  follow-redirects@>=1.16.0 <=1.16.1: ^1.16.2
  happy-dom@<=20.14.6: ^21.0.0
  happy-dom@>=17.0.0 <=21.0.3: ^21.0.4
  js-yaml@>=3.0.0 <3.15.2: ^3.15.2
  jsdom: "^31.0.1"
  markdown-it@<14.3.3: ^14.3.3
  minimatch@>=7.0.0 <11.0.1: ^11.0.1
  nanoid@<3.3.18: ^3.3.18
  postcss@<=8.5.22: ^8.5.23
  smol-toml@<=1.8.0: ^1.9.0
  source-map-js@>=1.0.0 <1.2.2: ^1.2.2
  stylus: "-"
  toml@<=5.0.0: ^5.0.1
  # CVE-2026-118764 has no 10.x fix, but typedoc can't run on minimatch 11 (it calls the removed
  # `Minimatch#matchOne`). It only matches our own entry-point globs at docs-build time, so keep it
  # on 10.x until typedoc supports 11.
  typedoc>minimatch: ^10.2.5
  vite@<=6.4.3: ^6.4.4

# Warn, do not fail, on unmet peer dependency ranges
strictPeerDependencies: false

allowBuilds:
  "@parcel/watcher": true
  dprint: true
  esbuild: true
  msgpackr-extract: true
  vue-demi: true

minimumReleaseAgeExclude:
  - "@cloudflare/workers-types@5.20261115.1"
  - vitepress-openapi@0.2.14
