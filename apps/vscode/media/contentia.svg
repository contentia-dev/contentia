       size) and a solid centre disc (radius 29.0), all divided into six 60-degree sectors
       with the rightmost removed. Each remaining sector has its own tint, stepping
       clockwise from the top right; black to light grey, for paper backgrounds. Butt caps keep the slice edges radial. -->
