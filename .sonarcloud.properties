# SonarQube Cloud automatic analysis: the GitHub App analyses each push, with
# no CI step. This file only tells it which files are code and which are tests.
sonar.sources=.
sonar.exclusions=examples/**,**/fixtures/**,**/*.test.ts,**/*.test.mts,**/*.test.mjs
sonar.tests=.
sonar.test.inclusions=**/*.test.ts,**/*.test.mts,**/*.test.mjs
