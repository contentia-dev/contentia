name: Release

# Publishes the npm packages from main, with provenance: npm records that each
# tarball was built from this commit by this workflow, and users can check it
# with `npm audit signatures`. `changeset publish` skips versions that are
# already on npm, so a push to main without a version bump publishes nothing.
#
# Nothing is published unless the checks pass: the same format, lint,
# typecheck, test and CLI smoke checks the husky hooks run, plus a gitleaks
# scan of everything reachable from main. They run only here, on main, to keep
# Actions minutes down; develop relies on the hooks. A manual run on any other
# branch runs the checks and skips the publish.
#
# npm accepts the publish through trusted publishing (OIDC), so no npm token is
# stored anywhere. NPM_TOKEN only bridges the first release, before the
# packages exist on npm and can be given a trusted publisher (RELEASING.md).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One release at a time, and never cancel one halfway through publishing.
concurrency:
  group: release
  cancel-in-progress: false

env:
  # Don't install husky's hooks: the pre-push hook would run the whole test
  # suite again on `git push --tags`. The checks job has already run it.
  HUSKY: '0'

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      # The gitleaks binary, not gitleaks-action: the action needs a license
      # key for repositories owned by an organization.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      # Every commit reachable from this one, not just the ones in this push:
      # the first push to main brings the whole history. Known false positives
      # are listed by fingerprint in .gitleaksignore.
      - name: Scan the history
        run: gitleaks git --redact --verbose --no-banner --log-opts='--full-history HEAD' .

  checks:
    name: Check and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      # Cached here, unlike the publish job: this job publishes nothing, and the
      # publish job installs and builds from scratch.
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test -- --passWithNoTests
      - name: CLI tarball smoke test
        run: pnpm smoke:cli

  npm:
    name: Publish to npm
    needs: [secrets, checks]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # push the release tags and create the GitHub release
      id-token: write # trusted publishing and provenance
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      # No dependency cache: a poisoned cache entry would end up in what we publish.
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm turbo run build --filter='./packages/*' --filter=@contentia/cli
      - name: Publish
        env:
          # pnpm reads PNPM_CONFIG_*, not NPM_CONFIG_*. Set explicitly so a
          # token-authenticated publish gets provenance too.
          PNPM_CONFIG_PROVENANCE: 'true'
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          pnpm release
      - name: Push tags and create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git push origin --tags
          version=$(node -p "require('./packages/contentia/package.json').version")
          # changeset publish tags each package it publishes; no tag, nothing to release.
          git rev-parse -q --verify "refs/tags/contentia@$version" >/dev/null || exit 0
          gh release view "v$version" >/dev/null 2>&1 && exit 0
          prerelease=$([[ $version == *-* ]] && echo --prerelease || true)
          gh release create "v$version" --target "$GITHUB_SHA" --title "v$version" --generate-notes $prerelease
