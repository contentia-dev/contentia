name: Deploy site

# Builds the VitePress docs and publishes them to GitHub Pages. The docs are the
# whole site: contentia.dev is served from the build's root (VitePress base '/').
#
# Deploys only from the primary branch
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'adapters.yaml'
      - 'packages/**'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  docs:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Cache turbo build
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-docs-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-docs-${{ runner.os }}-
      - name: Build
        run: pnpm turbo run build --filter=@contentia/docs
      - name: Finalize static tree
        run: |
          # .nojekyll keeps underscore dirs from being stripped by Jekyll.
          touch docs/.vitepress/dist/.nojekyll
      - name: Upload docs dist
        uses: actions/upload-artifact@v4
        with:
          name: docs-dist
          path: docs/.vitepress/dist

  deploy:
    name: Deploy
    needs: [docs]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download docs dist
        uses: actions/download-artifact@v4
        with:
          name: docs-dist
          path: site-dist
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site-dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
